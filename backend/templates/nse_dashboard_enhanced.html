<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kronos NSE Terminal · Upstox</title><script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script><style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px system-ui}header{padding:12px 18px;background:#161b22;color:#58a6ff;font-weight:bold}.app{display:flex;height:calc(100vh - 45px)}aside{width:270px;padding:12px;background:#161b22;overflow:auto}main{flex:1;display:flex;flex-direction:column}.controls>*{width:100%;margin:4px 0;padding:7px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px}.section{border-bottom:1px solid #30363d;padding:10px 0}.section h3{font-size:11px;color:#8b949e;text-transform:uppercase}.btn{cursor:pointer;background:#1f6feb!important}.warn{background:#3a2900!important;color:#ffd32a!important}.green{background:#1a4a2a!important}.card{padding:8px;background:#0d1117;border:1px solid #30363d;margin-top:8px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:5px}.muted{color:#8b949e;font-size:11px}#chart{flex:1;min-height:0}.status{padding:7px;background:#161b22;color:#8b949e}</style></head><body><header>KRONOS NSE TERMINAL <span style="color:#8b949e"> · UPSTOX DATA · AI STUDIO</span></header><div class="app"><aside><div class="section controls"><h3>Market data</h3><select id="symbol"></select><select id="interval"></select><input id="orb" type="number" value="15" min="1" max="60" placeholder="ORB minutes"><button class="btn" onclick="fetchData()">Fetch Upstox data</button><div id="conn" class="muted"></div></div><div class="section controls"><h3>Download Data</h3><a href="/download/nifty50.csv" class="btn" style="display:block;text-align:center;text-decoration:none;background:#238636!important">⬇ NIFTY 50 CSV</a><a href="/download/nifty50.json" class="btn" style="display:block;text-align:center;text-decoration:none;background:#238636!important">⬇ NIFTY 50 JSON</a></div><div class="section controls"><h3>Indicators</h3><label><input id="rsi" type="checkbox" checked> RSI</label><label><input id="macd" type="checkbox" checked> MACD</label><button onclick="refresh()">Refresh chart</button></div><div class="section controls"><h3>Kronos model</h3><select id="model"></select><select id="device"><option>cpu</option><option>cuda</option><option>mps</option></select><button class="green" onclick="loadModel()">Load model</button><div id="modelStatus" class="muted"></div></div><div class="section controls"><h3>Forecast</h3><input id="lookback" type="number" value="200"><input id="predlen" type="number" value="60"><input id="samples" type="number" value="3" min="1" max="10"><button class="warn" onclick="predict()">Run forecast</button><div id="prediction" class="card"></div></div><div class="section controls"><h3>Walk-forward backtest</h3><button onclick="backtest()">Run backtest</button><div id="backtest" class="card"></div></div><div class="section"><h3>Signal</h3><button onclick="signal()">Generate signal</button><pre id="signal" class="card" style="white-space:pre-wrap"></pre></div></aside><main><div id="chart"></div><div class="status" id="status">Ready. Set UPSTOX_ACCESS_TOKEN in AI Studio Secrets, then fetch data.</div></main></div><script>let data=null;const $=id=>document.getElementById(id);async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(!r.ok&&d.error)throw Error(d.error);return d}async function init(){try{let d=await api('/api/symbols');for(let [n,v] of Object.entries(d.symbols))$('symbol').add(new Option(n,v));for(let v of d.intervals)$('interval').add(new Option(v,v));let m=await api('/api/available-models');for(let[k,v]of Object.entries(m.models))$('model').add(new Option(v.name+' ('+v.params+')',k));let s=await api('/api/model-status');$('modelStatus').textContent=s.message||'Model not loaded';let c=await api('/api/data-source-status');$('conn').textContent=c.upstox_connected?'● Upstox credentials detected':'○ Set UPSTOX_ACCESS_TOKEN';}catch(e){$('status').textContent=e.message}}async function fetchData(){try{$('status').textContent='Fetching Upstox candles…';data=await api('/api/fetch-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:$('symbol').value,interval:$('interval').value,orb_minutes:+$('orb').value,show_rsi:$('rsi').checked,show_macd:$('macd').checked})});render(data.chart);$('status').textContent=data.message+' · last ₹'+data.last_price; }catch(e){$('status').textContent='Error: '+e.message}}function render(j){let f=JSON.parse(j);Plotly.react('chart',f.data,f.layout,{responsive:true,displayModeBar:false})}async function refresh(){if(!data)return;let d=await api('/api/refresh-chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orb_minutes:+$('orb').value,show_rsi:$('rsi').checked,show_macd:$('macd').checked})});render(d.chart)}async function loadModel(){try{let d=await api('/api/load-model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_key:$('model').value,device:$('device').value})});$('modelStatus').textContent=d.message||d.error}catch(e){$('modelStatus').textContent=e.message}}async function predict(){try{let d=await api('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookback:+$('lookback').value,pred_len:+$('predlen').value,sample_count:+$('samples').value})});let t=setInterval(async()=>{let r=await api('/api/predict-status/'+d.job_id);if(r.status==='done'){clearInterval(t);render(r.chart);$('prediction').textContent=JSON.stringify(r.stats,null,2);$('signal').textContent=JSON.stringify(r.signal,null,2)}if(r.status==='error'){clearInterval(t);$('status').textContent=r.error}},1500)}catch(e){$('status').textContent=e.message}}async function signal(){try{let d=await api('/api/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('signal').textContent=JSON.stringify(d.signal,null,2)}catch(e){$('status').textContent=e.message}}async function backtest(){try{let d=await api('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookback:+$('lookback').value})});let t=setInterval(async()=>{let r=await api('/api/backtest-status/'+d.job_id);$('backtest').textContent=(r.msg||'')+' '+(r.progress||0)+'%';if(r.status==='done'){clearInterval(t);
  const wrColor = (r.win_rate >= 50) ? '#26de81' : '#ff4757';
  const pfColor = (r.profit_factor >= 1.5) ? '#26de81' : ((r.profit_factor >= 1.0) ? '#ffd32a' : '#ff4757');
  const ptsColor = (r.net_points >= 0) ? '#26de81' : '#ff4757';
  const pnlColor = (r.total_pnl >= 0) ? '#26de81' : '#ff4757';
  const wt = r.winning_trades !== undefined ? r.winning_trades : '–';
  const lt = r.losing_trades !== undefined ? r.losing_trades : '–';
  $('backtest').innerHTML = `
    <div style='display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-bottom:8px'>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Win Rate</div>
        <div style='font-size:15px;font-weight:bold;color:${wrColor}'>${r.win_rate !== undefined ? r.win_rate + '%' : r.hit_rate + '%'}</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Profit Factor</div>
        <div style='font-size:15px;font-weight:bold;color:${pfColor}'>${r.profit_factor !== undefined ? r.profit_factor : '–'}</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Net Points</div>
        <div style='font-size:15px;font-weight:bold;color:${ptsColor}'>${r.net_points > 0 ? '+' : ''}${r.net_points !== undefined ? r.net_points : '–'} pt</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Trades</div>
        <div style='font-size:15px;font-weight:bold'>${r.n_trades} <span style='font-size:10px;color:#8b949e'>(${wt}W / ${lt}L)</span></div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Total P&L</div>
        <div style='font-size:14px;font-weight:bold;color:${pnlColor}'>${r.total_pnl >= 0 ? '+' : ''}₹${Number(r.total_pnl).toLocaleString('en-IN')}</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Max Drawdown</div>
        <div style='font-size:14px;font-weight:bold;color:#ff4757'>${r.max_drawdown}%</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Hit Rate</div>
        <div style='font-size:14px;font-weight:bold'>${r.hit_rate}%</div>
      </div>
      <div style='background:#161b22;padding:6px;border-radius:4px;border:1px solid #30363d'>
        <div style='color:#8b949e;font-size:9px;text-transform:uppercase'>Sharpe</div>
        <div style='font-size:14px;font-weight:bold'>${r.sharpe_ratio}</div>
      </div>
    </div>
    <details style='font-size:10px;color:#8b949e'><summary style='cursor:pointer'>View Raw Metrics JSON</summary><pre style='max-height:120px;overflow:auto;margin-top:4px'>${JSON.stringify(r,null,2)}</pre></details>
  `;
}},1500)}catch(e){$('status').textContent=e.message}}init();</script></body></html>
